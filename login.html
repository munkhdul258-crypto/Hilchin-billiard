<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нэвтрэх — Хилчин Биллиард</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div class="login-wrap" style="background-image:linear-gradient(rgba(15,23,42,0.55),rgba(15,23,42,0.55)),url('table-hero.jpg')">
    <div class="login-card">
      <img src="logo.png?v=10" alt="Хилчин Биллиард" class="login-logo-img" />
      <div class="login-title">Хилчин Биллиард & VIP PC Gaming</div>

      <div id="hb-login-error" class="error-box hidden"></div>

      <form id="hb-login-form">
        <div class="form-group">
          <label for="hb-email">Имэйл</label>
          <input type="email" id="hb-email" required placeholder="ажилтны@имэйл.com" />
        </div>
        <div class="form-group">
          <label for="hb-password">Нууц үг</label>
          <input type="password" id="hb-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Нэвтрэх</button>
      </form>
      <p class="muted" style="text-align:center; margin-top:16px; font-size:0.82rem;">
        Шинэ ажилтны эрхийг админ Supabase Dashboard-оос үүсгэнэ.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=10"></script>
  <script src="supabaseClient.js?v=10"></script>
  <script src="login.js?v=10"></script>
</body>
</html>
