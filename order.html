<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Захиалга — Хилчин Биллиард</title>
  <link rel="stylesheet" href="style.css?v=18" />
  <style>
    .order-navbar {
      display: flex; align-items: center; gap: 10px;
      background: rgba(9, 14, 26, 0.85);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      padding: 14px 18px;
      position: sticky; top: 0; z-index: 30;
      border-bottom: 1px solid var(--border-soft);
    }
    .order-navbar::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan) 20%, var(--primary) 50%, var(--neon-pink) 80%, transparent);
      opacity: 0.65;
    }
    .order-brand {
      font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.98rem;
      font-family: "Poppins", "Inter", sans-serif;
      background: linear-gradient(120deg, var(--neon-cyan-soft), var(--primary-soft) 45%, var(--neon-pink-soft));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .order-page { max-width: 480px; margin: 0 auto; padding: 22px 16px 130px; position: relative; }
    .order-step { display: none; animation: fadeUp 0.3s var(--ease); }
    .order-step.active { display: block; }
    .order-step-title { font-size: 1rem; font-weight: 700; margin: 0 0 14px; color: var(--text); font-family: "Poppins", sans-serif; }

    .table-pick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .table-pick-btn {
      background: linear-gradient(160deg, rgba(0,229,255,0.08), rgba(13,23,39,0.92));
      border: 1px solid var(--border-soft); clip-path: var(--chamfer-sm);
      padding: 22px 10px; text-align: center; color: var(--text); font-weight: 700; font-size: 1.05rem;
      font-family: "Orbitron", "Poppins", sans-serif;
      cursor: pointer; transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .table-pick-btn:hover { transform: translateY(-3px); box-shadow: var(--glow-cyan); border-color: var(--neon-cyan); }
    .table-pick-btn:active { transform: translateY(0) scale(0.98); }

    .menu-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); clip-path: var(--chamfer-sm);
      padding: 14px 16px; margin-bottom: 10px; transition: border-color 0.2s var(--ease);
    }
    .menu-item:hover { border-color: rgba(0,229,255,0.4); }
    .menu-item-info { flex: 1; min-width: 0; }
    .menu-item-name { font-weight: 600; }
    .menu-item-price { color: var(--muted); font-size: 0.82rem; margin-top: 2px; font-family: "Orbitron", sans-serif; }
    .menu-item-qty { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border-soft);
      background: var(--surface-2); color: var(--neon-cyan-soft); font-size: 1.2rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease);
    }
    .qty-btn:hover { box-shadow: var(--glow-cyan); }
    .qty-btn:active { transform: scale(0.9); }
    .qty-val { min-width: 22px; text-align: center; font-weight: 700; font-family: "Orbitron", sans-serif; }

    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
      background: rgba(9, 14, 26, 0.96); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-soft); padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    }
    .cart-bar-total { font-weight: 700; font-family: "Orbitron", sans-serif; color: var(--neon-cyan-soft); text-shadow: 0 0 10px rgba(0,229,255,0.4); }
    .order-back { background: none; border: none; color: var(--neon-cyan-soft); cursor: pointer; font-size: 0.9rem; margin-bottom: 14px; padding: 0; }
    .order-confirm-box { text-align: center; padding: 50px 10px; }
    .order-confirm-box .big-check { font-size: 3.2rem; margin-bottom: 12px; filter: drop-shadow(0 0 14px rgba(63,237,181,0.6)); }
    .order-confirm-box h2 { font-family: "Poppins", sans-serif; }

    .bill-panel {
      max-width: 480px; margin: 0 auto; padding: 12px 16px;
      background: linear-gradient(160deg, rgba(212,175,55,0.08), rgba(13,23,39,0.94));
      border: 1px solid var(--border-soft); border-bottom: 1px solid rgba(212,175,55,0.35);
      position: sticky; top: 58px; z-index: 20;
    }
    .bill-panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .bill-panel-label { font-size: 0.82rem; color: var(--muted); }
    .bill-panel-label b { color: var(--text); }
    .bill-panel-total {
      font-family: "Orbitron", sans-serif; font-weight: 700; font-size: 1.1rem;
      color: var(--primary-soft); text-shadow: 0 0 10px rgba(212,175,55,0.4);
      white-space: nowrap;
    }
    .bill-panel-toggle {
      background: none; border: none; color: var(--neon-cyan-soft); font-size: 0.78rem;
      cursor: pointer; padding: 6px 0 0; text-align: left;
    }
    .bill-panel-history { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
    .bill-history-item { border-top: 1px solid var(--border); padding-top: 6px; }
    .bill-history-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .bill-history-items { font-size: 0.8rem; color: var(--text); }
  </style>
</head>
<body>
  <div class="order-navbar">
    <img src="logo.png?v=18" alt="Хилчин Биллиард" class="nav-logo" />
    <div class="order-brand">Хилчин Биллиард — Захиалга</div>
  </div>

  <div id="hb-bill-panel" class="bill-panel hidden">
    <div class="bill-panel-row">
      <span class="bill-panel-label">Ширээ <b id="hb-bill-table-name"></b> — одоогийн тооцоо</span>
      <span class="bill-panel-total" id="hb-bill-total">0₮</span>
    </div>
    <button type="button" class="bill-panel-toggle" id="hb-bill-toggle">Захиалгынхаа явцыг харах ▾</button>
    <div id="hb-bill-history" class="bill-panel-history hidden"></div>
  </div>

  <div class="order-page">
    <div id="hb-error" class="error-box hidden"></div>

    <!-- Алхам 1: Ширээ сонгох -->
    <div id="hb-step-table" class="order-step active">
      <p class="order-step-title" id="hb-step-table-title">Та сууж буй ширээгээ сонгоно уу</p>
      <div id="hb-table-grid" class="table-pick-grid">
        <p class="muted">Ачааллаж байна...</p>
      </div>
    </div>

    <!-- Алхам 2: Цэс сонгох -->
    <div id="hb-step-menu" class="order-step">
      <button type="button" class="order-back" id="hb-back-to-table">← Ширээгээ солих</button>
      <p class="order-step-title"><span id="hb-selected-table-name"></span> — цэснээс сонгоно уу</p>
      <div id="hb-menu-list"></div>
      <div class="form-group" style="margin-top:16px;">
        <label for="hb-order-note">Нэмэлт тэмдэглэл (заавал биш)</label>
        <input type="text" id="hb-order-note" placeholder="жишээ: мөс бага хийж өгнө үү" />
      </div>
    </div>

    <!-- Алхам 3: Баталгаажуулалт -->
    <div id="hb-step-done" class="order-step">
      <div class="order-confirm-box">
        <div class="big-check">✅</div>
        <h2>Захиалга илгээгдлээ!</h2>
        <p class="muted">Зөөгч удахгүй авчирна. Дээрх тооцооны хэсэгт баталгаажсан даруйд шинэчлэгдэнэ. Баярлалаа!</p>
        <button type="button" class="btn btn-primary" id="hb-new-order" style="margin-top:18px;">Дахин захиалах</button>
      </div>
    </div>
  </div>

  <div id="hb-cart-bar" class="cart-bar hidden">
    <div>Сагс: <span id="hb-cart-count">0</span> бараа · <span class="cart-bar-total" id="hb-cart-total">0₮</span></div>
    <button type="button" class="btn btn-primary btn-sm" id="hb-submit-order">Захиалга өгөх</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=18"></script>
  <script src="supabaseClient.js?v=18"></script>
  <script src="order.js?v=18"></script>
</body>
</html>
