<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Захиалга — Хилчин Биллиард</title>
  <link rel="stylesheet" href="style.css?v=14" />
  <style>
    .order-page { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; }
    .order-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .order-header img { height: 38px; width: auto; border-radius: 8px; }
    .order-header h1 { font-size: 1.1rem; margin: 0; }
    .order-step { display: none; }
    .order-step.active { display: block; }
    .table-pick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .table-pick-btn {
      background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius);
      padding: 18px 10px; text-align: center; color: var(--text); font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease);
    }
    .table-pick-btn:hover { transform: translateY(-2px); box-shadow: var(--glow-cyan); border-color: var(--neon-cyan); }
    .menu-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 10px;
    }
    .menu-item-info { flex: 1; min-width: 0; }
    .menu-item-name { font-weight: 600; }
    .menu-item-price { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
    .menu-item-qty { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border-soft);
      background: var(--surface-2); color: var(--neon-cyan-soft); font-size: 1.1rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .qty-val { min-width: 22px; text-align: center; font-weight: 700; }
    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
      background: rgba(9, 14, 26, 0.96); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-soft); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
    }
    .cart-bar-total { font-weight: 700; font-family: "Orbitron", sans-serif; color: var(--neon-cyan-soft); }
    .order-back { background: none; border: none; color: var(--neon-cyan-soft); cursor: pointer; font-size: 0.9rem; margin-bottom: 12px; padding: 0; }
    .order-confirm-box { text-align: center; padding: 40px 10px; }
    .order-confirm-box .big-check { font-size: 3rem; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="order-page">
    <div class="order-header">
      <img src="logo.png?v=14" alt="Хилчин Биллиард" />
      <h1>Хилчин Биллиард — Захиалга</h1>
    </div>

    <div id="hb-error" class="error-box hidden"></div>

    <!-- Алхам 1: Ширээ сонгох -->
    <div id="hb-step-table" class="order-step active">
      <p class="muted" style="margin-bottom:14px;">Та сууж буй ширээгээ сонгоно уу:</p>
      <div id="hb-table-grid" class="table-pick-grid">
        <p class="muted">Ачааллаж байна...</p>
      </div>
    </div>

    <!-- Алхам 2: Цэс сонгох -->
    <div id="hb-step-menu" class="order-step">
      <button type="button" class="order-back" id="hb-back-to-table">← Ширээгээ солих</button>
      <p class="muted" style="margin-bottom:6px;"><strong id="hb-selected-table-name"></strong> — цэснээс сонгоно уу:</p>
      <div id="hb-menu-list"></div>
      <div class="form-group" style="margin-top:16px;">
        <label for="hb-order-note">Нэмэлт тэмдэглэл (заавал биш)</label>
        <input type="text" id="hb-order-note" placeholder="жишээ: мөс бага хийж өгнө үү" />
      </div>
    </div>

    <!-- Алхам 3: Баталгаажуулалт -->
    <div id="hb-step-done" class="order-step">
      <div class="order-confirm-box">
        <div class="big-check">✅</div>
        <h2>Захиалга илгээгдлээ!</h2>
        <p class="muted">Зөөгч удахгүй авчирна. Баярлалаа!</p>
        <button type="button" class="btn btn-primary" id="hb-new-order" style="margin-top:18px;">Дахин захиалах</button>
      </div>
    </div>
  </div>

  <div id="hb-cart-bar" class="cart-bar hidden">
    <div>Сагс: <span id="hb-cart-count">0</span> бараа · <span class="cart-bar-total" id="hb-cart-total">0₮</span></div>
    <button type="button" class="btn btn-primary btn-sm" id="hb-submit-order">Захиалга өгөх</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=14"></script>
  <script src="supabaseClient.js?v=14"></script>
  <script src="order.js?v=14"></script>
</body>
</html>
