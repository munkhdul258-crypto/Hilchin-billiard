<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хянах самбар — Хилчин Биллиард</title>
  <link rel="stylesheet" href="style.css?v=19" />
</head>
<body>
  <div id="hb-navbar"></div>

  <div class="page">
    <div class="page-header">
      <h1>Хянах самбар</h1>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Өнөөдрийн орлого</div>
        <div class="stat-value" id="hb-dash-revenue">0₮</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Өнөөдрийн зарлага</div>
        <div class="stat-value" id="hb-dash-expense">0₮</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Цэвэр ашиг</div>
        <div class="stat-value" id="hb-dash-net">0₮</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Барагдаагүй урьдчилгаа</div>
        <div class="stat-value" id="hb-dash-advances">0₮</div>
      </div>
    </div>

    <div class="section-title" style="margin-top:0;">Сүүлийн 14 хоног — орлого / зарлага</div>
    <div class="chart-wrap">
      <canvas id="hb-dash-revenue-chart" height="85"></canvas>
    </div>

    <div class="section-title">Ээлжийн кассын зөрүү</div>
    <div class="chart-wrap">
      <canvas id="hb-dash-diff-chart" height="85"></canvas>
    </div>

    <div class="section-title">Сүүлийн ээлжүүд</div>
    <table class="data-table">
      <thead>
        <tr><th>Огноо</th><th>Ажилтан</th><th>Орлого</th><th>Нийт зөрүү</th></tr>
      </thead>
      <tbody id="hb-dash-shifts-body"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="config.js?v=19"></script>
  <script src="supabaseClient.js?v=19"></script>
  <script src="auth.js?v=19"></script>
  <script src="dashboard.js?v=19"></script>
</body>
</html>
