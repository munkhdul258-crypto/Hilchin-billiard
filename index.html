<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ширээнүүд — Hilchin Billiard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hb-navbar"></div>

  <div class="page">
    <div class="page-header">
      <h1>Ширээнүүд</h1>
    </div>

    <div id="hb-error" class="error-box hidden"></div>

    <div id="hb-add-table-wrap" class="card hidden" style="margin-bottom:20px;">
      <form id="hb-add-table-form" class="form-row">
        <div class="form-group">
          <label for="hb-new-table-name">Ширээний нэр</label>
          <input type="text" id="hb-new-table-name" placeholder="Ширээ 4" required />
        </div>
        <div class="form-group">
          <label for="hb-new-table-rate">Цагийн үнэ (₮)</label>
          <input type="number" id="hb-new-table-rate" placeholder="15000" min="0" step="500" required />
        </div>
        <button type="submit" class="btn btn-primary">+ Ширээ нэмэх</button>
      </form>
    </div>

    <div id="hb-tables-grid" class="tables-grid">
      <p class="muted">Ачааллаж байна...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
