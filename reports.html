<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тайлан — Hilchin Billiard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hb-navbar"></div>

  <div class="page">
    <div class="page-header">
      <h1>Орлогын тайлан</h1>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="preset-btns">
        <button type="button" class="btn btn-ghost btn-sm" data-preset="today">Өнөөдөр</button>
        <button type="button" class="btn btn-ghost btn-sm" data-preset="week">Сүүлийн 7 хоног</button>
        <button type="button" class="btn btn-ghost btn-sm" data-preset="month">Энэ сар</button>
      </div>
      <form id="hb-range-form" class="form-row" style="margin-top:10px;">
        <div class="form-group">
          <label for="hb-from">Эхлэх огноо</label>
          <input type="date" id="hb-from" required />
        </div>
        <div class="form-group">
          <label for="hb-to">Дуусах огноо</label>
          <input type="date" id="hb-to" required />
        </div>
        <button type="submit" class="btn btn-primary">Шүүх</button>
      </form>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Нийт орлого</div>
        <div class="stat-value" id="hb-stat-revenue">0₮</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Session тоо</div>
        <div class="stat-value" id="hb-stat-sessions">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Нийт цаг</div>
        <div class="stat-value" id="hb-stat-hours">0 ц</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Дундаж орлого/session</div>
        <div class="stat-value" id="hb-stat-avg">0₮</div>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="hb-chart" height="90"></canvas>
    </div>

    <div class="section-title">Ширээгээр</div>
    <table class="data-table">
      <thead>
        <tr><th>Ширээ</th><th>Session тоо</th><th>Орлого</th></tr>
      </thead>
      <tbody id="hb-by-table-body"></tbody>
    </table>

    <div class="section-title">Session түүх</div>
    <table class="data-table">
      <thead>
        <tr><th>Дууссан цаг</th><th>Ширээ</th><th>Үргэлжилсэн</th><th>Дүн</th></tr>
      </thead>
      <tbody id="hb-history-body"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="reports.js"></script>
</body>
</html>
